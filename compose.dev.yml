# Разработка: docker compose -f compose.dev.yml up --build
# Код ./app монтируется в контейнер, runserver перезапускается при изменениях.
name: ozone-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ozone_postgres_dev
    restart: always
    env_file: .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # при первом запуске (пустой том) восстанавливается local_data/backup_*.sql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./local_data:/local_data:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    container_name: ozone_django_app_dev
    restart: always
    env_file: .env.dev
    volumes:
      - ./app:/app
      # медиафайлы из распакованного бэкапа (local_data/media, в .gitignore)
      - ./local_data/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: ozone_nginx_dev
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ozone.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    # прежнее имя тома — уже восстановленная из дампа БД сохраняется
    name: ozone-bsu_postgres_data_redesign
