services:
  postgres:
    image: postgres:16-alpine
    container_name: ozone_postgres_dev
    env_file:
      - ./ozone_v4/.env.dev
    volumes:
      - postgres_data_redesign:/var/lib/postgresql/data
      # при первом запуске (пустой том) восстанавливается local_data/backup_*.sql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./local_data:/local_data:ro
    ports:
      - "5433:5432"

  django:
    build:
      context: ./ozone_v4
      dockerfile: Dockerfile.dev
    container_name: ozone_django_app_dev
    volumes:
      - ./ozone_v4/:/ozone
      # медиафайлы из распакованного бэкапа (local_data/media, в .gitignore)
      - ./local_data/media:/ozone/media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - ./ozone_v4/.env.dev

  nginx:
    image: nginx:latest
    container_name: ozone_nginx_dev
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/nginx_ozone.dev.conf:/etc/nginx/conf.d/nginx_ozone.conf
    ports:
      - "8081:80"
    depends_on:
      - django

volumes:
  postgres_data_redesign:
