# Продакшен: docker compose up -d --build
# Переменные — в .env (шаблон: .env.example)
name: ozone

services:
  postgres:
    image: postgres:16-alpine
    container_name: ozone_postgres
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # порт наружу не публикуется: доступ только из сети compose

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    image: ozone-django:latest
    container_name: ozone_django_app
    restart: always
    env_file: .env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: ozone_nginx
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ozone.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - static_data:/staticfiles:ro
      - media_data:/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  static_data:
  media_data:
