# Разработка: http://localhost:8081 (статику и медиа отдаёт Django, DEBUG=True)
server {
    listen 80;
    server_name localhost 127.0.0.1;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location / {
        proxy_pass http://ozone_django_app_dev:8000;
        # $http_host — вместе с портом (:8081), иначе не пройдёт проверка CSRF
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
