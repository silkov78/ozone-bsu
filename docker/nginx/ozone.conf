# Продакшен: ozone.bsu.by
upstream django { server ozone_django_app:8000; }

server {
    listen 80;
    server_name ozone.bsu.by www.ozone.bsu.by 217.21.43.41;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://ozone.bsu.by$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ozone.bsu.by www.ozone.bsu.by;

    # ВАЖНО: файл .cer должен содержать полную цепочку (сертификат сайта + промежуточный
    # GlobalSign), иначе часть клиентов не доверяет сайту («unable to verify the first certificate»).
    ssl_certificate     certs/globalsign.cer;
    ssl_certificate_key certs/globalsign.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
